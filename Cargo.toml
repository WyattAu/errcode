[package]
name = "error-codes"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Structured error handling for Rust — derive macros for error codes, HTTP status mapping, and RFC 7807 Problem Details"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/errcode"
keywords = ["error", "http", "problem-details", "rfc7807", "derive"]
categories = ["rust-patterns", "web-programming"]
exclude = ["/target"]
readme = "README.md"

[dependencies]
thiserror = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
sqlx = { version = "0.8", optional = true }
anyhow = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }

[features]
default = ["std", "axum", "serde_impl"]
std = ["thiserror/std"]
axum = ["dep:axum"]
sqlx = ["dep:sqlx"]
anyhow = ["dep:anyhow"]
serde_impl = ["dep:serde", "dep:serde_json"]

[[bench]]
name = "errcode_bench"
harness = false

[dev-dependencies]
proptest = "1"
serde_json = "1"
criterion = { version = "0.7", features = ["html_reports"] }
