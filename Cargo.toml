[package]
name = "error-codes"
version = "1.1.0"
edition = "2024"
rust-version = "1.85"
description = "Structured error handling for Rust — derive macros for error codes, HTTP status mapping, and RFC 7807 Problem Details"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/errcode"
keywords = ["error", "http", "problem-details", "rfc7807", "derive"]
categories = ["rust-patterns", "web-programming"]
exclude = ["/target"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
schemars = { version = "1", optional = true }
utoipa = { version = "5", optional = true }

[features]
default = ["std", "axum", "serde_impl"]
std = []
axum = []
sqlx = []
anyhow = []
serde_impl = ["dep:serde", "dep:serde_json"]
schemars = ["dep:schemars", "serde_impl", "std"]
utoipa = ["dep:utoipa", "serde_impl", "std"]

[[bench]]
name = "errcode_bench"
harness = false

[dev-dependencies]
proptest = "1"
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
